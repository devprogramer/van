<h1>Мої проєкти</h1>
<p><a href="{% url 'van_create' %}">+ Новий проєкт</a></p>

<table cellpadding="8" style="border-collapse:collapse;">
  <tr style="text-align:left; border-bottom:1px solid #999;">
    <th>Назва</th><th>Кузов</th><th>Змінено</th><th></th>
  </tr>
  {% for p in projects %}
    <tr style="border-bottom:1px solid #ddd;">
      <td><a href="{% url 'van_editor' p.pk %}">{{ p.title }}</a></td>
      <td>{{ p.van.name }}</td>
      <td>{{ p.updated_at|date:"d.m.Y H:i" }}</td>
      <td>
        <form method="post" action="{% url 'van_delete' p.pk %}"
              onsubmit="return confirm('Видалити проєкт «{{ p.title|escapejs }}»? Це не можна скасувати.');">
          {% csrf_token %}
          <button type="submit">Видалити</button>
        </form>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="4">Проєктів ще немає. Створіть перший.</td></tr>
  {% endfor %}
</table>
